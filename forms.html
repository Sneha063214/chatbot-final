input {

    </head>
    <body>
        
        <div class="parent">
            <div class="navbar">
                <img src="images/flightlogo.png" alt="" id="i2" >
                <div class="list">
                    <ul>
                        <li>HOME</li>
                        <li>ABOUT</li>
                        <li><a href="login.html">LOGIN</a></li>
                        <li>REGISTER</li>
                        <li>CONTACT</li>
                    </ul>
                </div>
                
            </div>
            <div class="analyse">
                Data analysed here
            </div>
                <div class="chatbot" >
                    <!-- <div class="box1"></div> -->
                     
                    <div class="box2" >
                        <div class="heading">YOUR GUIDE</div>
                        <div class="chatarea"id="chat"></div>
                        <div class="typing" >
                          <input type="text" id="input" placeholder="Hi , how can I help??" onkeypress="if(event.key=='Enter') sendMessage()">
                          <button type="submit" id="send" onclick="sendMessage()"><i class="ri-send-ins-line"></i></button>
                        </div>
                    </div>
                </div>
        </div>

        <script>
            function sendMessage(){
                const input=document.getElementById('input');
                const chat=document.getElementById('chat');
                const message=input.value.trim();
                if(!message){
                    return;
                }
                // chat.innerHTML+='<div> class="user">You: '+message+ '</div>';
                chat.innerHTML += '<div class="user">You: ' + message + '</div>';
                input.value='';
                //send to flash backend
                fetch('/chat',{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({message:message})
                })
                .then(response=>response.json())
                .then(data=>{
                    chat.innerHTML+='<div class="bot">Bot: '+data.response+'</div>';
                    chat.scrollTop=chat.scrollHeight;

                });
                
            }

        window.onload = function(){

    const openBtn = document.getElementById("openChatBtn");
    const chatBox = document.querySelector(".box2");

    openBtn.addEventListener("click", () => {
        if (chatBox.style.display === "none" || chatBox.style.display === "") {
            chatBox.style.display = "flex";
        } else {
            chatBox.style.display = "none";
        }
    });

}
        </script>
        <button id="openChatBtn">💬</button>

    </body>
